{% extends "base.html" %}
{% block title %}Editar anúncio{% endblock %}
{% block content %}
    <h1>Editar anúncio</h1>
    <form method="POST">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" name="titulo" value="{{ anuncio.titulo }}" required>

        <label for="descricao">Descrição</label>
        <textarea id="descricao" name="descricao" rows="4">{{ anuncio.descricao or "" }}</textarea>

        <label for="preco">Preço (R$)</label>
        <input type="number" step="0.01" min="0" id="preco" name="preco" value="{{ anuncio.preco }}" required>

        <label for="categoria_id">Categoria</label>
        <select id="categoria_id" name="categoria_id" required>
            {% for c in categorias %}
                <option value="{{ c.id }}" {% if c.id == anuncio.categoria_id %}selected{% endif %}>{{ c.nome }}</option>
            {% endfor %}
        </select>

        <label for="status">Status</label>
        <select id="status" name="status">
            {% for s in ['ativo', 'vendido', 'inativo'] %}
                <option value="{{ s }}" {% if s == anuncio.status %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>

        <button type="submit">Salvar</button>
    </form>
{% endblock %}
